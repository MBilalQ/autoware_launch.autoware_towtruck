/**:
  ros__parameters:
    update_rate: 10.0
    add_duplicated_node_names_to_msg: true # if true, duplicated node names are added to msg
    cleanup_leftover_processes_on_startup: true
    cleanup_wait_sec: 2.0
    cleanup_match_cmdline_patterns:
      - /workspace/install/
      - /workspace/src/launcher/autoware_launch/
      - /home/efs/autoware_towtruck/install/
      - /home/efs/autoware_towtruck/src/launcher/autoware_launch/
      - /opt/ros/humble/lib/rclcpp_components/component_container
      - /opt/ros/humble/lib/rclcpp_components/component_container_mt
      - /opt/ros/humble/lib/topic_tools/relay
      - ros2 launch autoware_launch
      - ros2 launch autonomous_towtruck_launch
      - wheel_steering_only.launch.xml
      - wheel_steering_lidar_localization.launch.xml
      - __node:=map_container
      - __node:=pointcloud_container
      - __node:=trajectory_relay
      - /robot_state_publisher
      - robot_state_publisher
    nodes_to_ignore:  # List of nodes to ignore when checking for duplicates
      - /rviz2
      - /simulation/getParameter
